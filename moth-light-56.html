  :root{--teal:#5EEAD4;--ink:#14132B;--lav:#B9B4E8;--lav2:#D9D4FF;--gold:#FFD166;--hair:rgba(255,255,255,.2);--glass:rgba(255,255,255,.08);--ease:cubic-bezier(.2,.8,.2,1)}
  html,body{margin:0;height:100%;background:#14132B;overflow:hidden;touch-action:none;
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;
    overscroll-behavior:none;font-family:MothText,system-ui,sans-serif;font-weight:500;color:#E9E6FF}
  canvas{display:block;width:100%;height:100%;touch-action:none}
  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
  .overlay{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:12px;text-align:center;padding:24px;background:rgba(20,19,43,.74);transition:opacity .4s ease}
  .overlay.hide{opacity:0;pointer-events:none}
  h1{font-family:MothDisplay,serif;font-size:44px;margin:0;font-weight:700;letter-spacing:3px;animation:bob 3s ease-in-out infinite;
    text-shadow:0 0 24px rgba(94,234,212,.55)}
  h1.sr{animation:none;text-shadow:none}
  p{margin:0;max-width:290px;line-height:1.45;color:var(--lav);font-size:16px}
  .score-big{font-family:MothDisplay,serif;font-size:64px;font-weight:700;color:var(--teal);text-shadow:0 0 28px rgba(94,234,212,.6)}
  /* one button system: .main is the primary action, .alt and .chip are secondary, panel buttons are the compact size of the same pill */
  button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation;-webkit-appearance:none;appearance:none;
    transition:transform .14s var(--ease),background-color .2s,border-color .2s,color .2s,opacity .2s}
  button:active{transform:scale(.95)}
  button:focus-visible{outline:2px solid var(--teal);outline-offset:3px}
  button.main{font-family:MothDisplay,serif;font-size:20px;font-weight:700;letter-spacing:2px;color:var(--ink);background:var(--teal);
    border:0;border-radius:999px;min-height:52px;padding:0 44px;margin-top:4px;animation:pulse 1.8s infinite}
  button.alt,.chip,#menuPanel button,#testPanel button{font-size:15px;color:var(--lav2);background:var(--glass);border:1.5px solid var(--hair);
    border-radius:999px;min-height:44px;padding:0 22px;text-align:center}
  button.alt{position:relative}
  #menuPanel button,#testPanel button,#gfxRow button,#skipBtn{font-size:14px;min-height:38px;padding:0 16px}
  .has-new::after{content:'';position:absolute;top:-3px;right:-3px;width:11px;height:11px;border-radius:50%;background:var(--gold);
    box-shadow:0 0 0 2px var(--ink),0 0 12px var(--gold);animation:dotpulse 1.6s ease-in-out infinite}
  #menu{justify-content:flex-end;padding-bottom:calc(34px + env(safe-area-inset-bottom));
    background:linear-gradient(to top,rgba(20,19,43,.88) 0%,rgba(20,19,43,.5) 38%,rgba(20,19,43,0) 68%)}
  #menu .tag{font-size:17px;color:var(--lav2);max-width:none;margin-bottom:6px}
  #menu .row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
  #bestMenu:empty{display:none}
  #menuBtn{position:fixed;left:14px;bottom:calc(14px + env(safe-area-inset-bottom));z-index:20;width:44px;height:38px;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:5px;color:var(--lav);background:var(--glass);border:1.5px solid var(--hair);border-radius:999px;padding:0}
  #menuBtn i{display:block;width:18px;height:2px;border-radius:2px;background:var(--lav2)}
  #menuPanel{position:fixed;left:14px;bottom:calc(60px + env(safe-area-inset-bottom));z-index:20;display:none;flex-direction:column;gap:8px;padding:12px;min-width:210px;
    border-radius:20px;background:rgba(20,19,43,.94);border:1.5px solid var(--hair)}
  #menuPanel.open{display:flex}
  #snd.off{opacity:.6;text-decoration:line-through}
  #pauseBtn{display:none}
  #pauseBtn.show{display:block}
  #menuPanel .lbl{font-size:12px;color:#9C97CC;letter-spacing:1px;margin:2px 0 -2px 4px;text-align:left}
  #gfxRow{display:flex;gap:6px}
  #gfxRow button{flex:1;padding:0 4px}
  #gfxRow button.cur,#testPanel button.cur{border-color:var(--teal);color:var(--teal);background:rgba(94,234,212,.12)}
  #skipBtn{position:fixed;top:calc(8px + env(safe-area-inset-top));right:12px;z-index:25;display:none}
  #skipBtn.show{display:block}
  #testBtn,#testPanel{position:fixed;left:50%;transform:translateX(-50%);z-index:5;display:none}
  #testBtn{bottom:calc(14px + env(safe-area-inset-bottom));font:inherit;font-size:14px;color:var(--gold);background:var(--glass);
    border:1.5px dashed rgba(255,209,102,.6);border-radius:999px;min-height:38px;padding:0 18px}
  #testBtn.show{display:block}
  #testPanel{bottom:calc(60px + env(safe-area-inset-bottom));flex-direction:column;gap:6px;padding:10px;border-radius:20px;
    background:rgba(20,19,43,.92);border:1.5px solid var(--hair)}
  #testPanel.open{display:flex}
  #testPanel button{white-space:nowrap}
  #closet h2{font-family:MothDisplay,serif;font-size:30px;margin:0;letter-spacing:2px}
  #closet .lb2{font-size:12px;letter-spacing:2px;color:#9C97CC;margin-top:4px}
  #closet .grid{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;max-width:340px}
  #closet .gear{position:relative;font-size:13px;color:#E8E6FF;background:var(--glass);border:1.5px solid var(--hair);border-radius:16px;padding:10px;width:104px;display:flex;flex-direction:column;align-items:center;gap:5px}
  #closet .gear.fresh{border-color:rgba(255,209,102,.7)}
  #closet .gear.cur{border-color:var(--teal);background:rgba(94,234,212,.14)}
  #closet .gear.lock{opacity:.5}
  #closet .gear small{font-size:10.5px;color:var(--lav);line-height:1.2}
  #closet .sw{width:30px;height:30px;border-radius:50%;border:2px solid rgba(255,255,255,.5)}
  #closet .gear .nw{position:absolute;top:-8px;right:-4px;font-style:normal;font-size:10px;font-weight:700;letter-spacing:.5px;color:var(--ink);background:var(--gold);border-radius:999px;padding:2px 8px;animation:nwpop .5s var(--ease) both}
  #closet .gear.fresh .sw{animation:swpop .9s var(--ease) both}
  #closet .gear.pick .sw{animation:selpop .35s var(--ease)}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(94,234,212,.55)}70%{box-shadow:0 0 0 18px rgba(94,234,212,0)}100%{box-shadow:0 0 0 0 rgba(94,234,212,0)}}
  @keyframes dotpulse{0%,100%{transform:scale(1)}50%{transform:scale(1.25)}}
  @keyframes nwpop{0%{transform:scale(0) rotate(-12deg)}100%{transform:scale(1) rotate(0)}}
  @keyframes swpop{0%{transform:scale(.4);box-shadow:0 0 0 0 rgba(255,209,102,.9)}55%{transform:scale(1.25)}100%{transform:scale(1);box-shadow:0 0 0 14px rgba(255,209,102,0)}}
  @keyframes selpop{0%{transform:scale(.7)}60%{transform:scale(1.2)}100%{transform:scale(1)}}
  @media (prefers-reduced-motion:reduce){h1,button.main,.has-new::after,#closet .gear .nw,#closet .gear.fresh .sw,#closet .gear.pick .sw{animation:none}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<button id="menuBtn" aria-label="Menu"><i></i><i></i><i></i></button>
<div id="menuPanel">
  <button id="snd">Sound on</button>
  <button id="pauseBtn">Pause</button>
  <div class="lbl">GRAPHICS</div>
  <div id="gfxRow"><button data-q="2">Low</button><button data-q="1">Medium</button><button data-q="0">High</button></div>
</div>
<button id="testBtn">Test</button>
<div id="testPanel"></div>

<button id="skipBtn" class="chip">Skip</button>

<div class="overlay" id="menu">
  <h1 class="sr">Moth Light</h1>
  <p class="tag">Drag to steer. Catch the glow.</p>
  <button class="main" id="startBtn">Play</button>
  <div class="row"><button class="alt" id="pvBtn">Watch trailer</button><button class="alt" id="closetBtn">Moth wardrobe</button></div>
  <p id="bestMenu"></p>
</div>

<div class="overlay hide" id="closet" style="background:#14132B;z-index:30">
  <h2>Moth wardrobe</h2>
  <div class="lb2">SKINS</div><div class="grid" id="skinGrid"></div>
  <div class="lb2">TRAILS</div><div class="grid" id="trailGrid"></div>
  <button class="main" id="closetDone" style="animation:none">Done</button>
</div>

<div class="overlay hide" id="paused">
  <h1>Paused</h1>
  <p>Your run is frozen. Resume when you're ready.</p>
  <button class="main" id="resumeBtn">Resume</button>
  <button class="alt" id="restartBtn">Restart</button>
</div>

<div class="overlay hide" id="over">
  <p>You scored</p>
  <div class="score-big" id="finalScore">0</div>
  <p id="bestOver"></p>
  <button class="main" id="againBtn">Play again</button>
  <button class="alt" id="closetBtn2">Moth wardrobe</button>
</div>

    reset(); state = 'play'; paused = false; pausedEl.classList.add('hide');
    menu.classList.add('hide'); over.classList.add('hide');
    Sound.start();
  }
  function endGame() {
    state = 'over'; diff = 0; tierShown = 0; boss = null; bolts = []; bossPending = 0; trans = null; hudA = 1; od = 0; surge = null; card = null; banner = null; nar = null; defrag = null; ctd = null;
    if (score > best) best = score;
    document.getElementById('finalScore').textContent = score;
    document.getElementById('bestOver').textContent = 'Best this session: ' + best;
    Sound.duck(true); Sound.over();
    setTimeout(() => over.classList.remove('hide'), 700);
  }

  document.getElementById('startBtn').addEventListener('click', () => { if (!pvSeen && !save.pv) startPV('play'); else startGame(); });
  document.getElementById('pvBtn').addEventListener('click', () => startPV('menu'));
  document.getElementById('skipBtn').addEventListener('click', () => pvEnd());
  window.addEventListener('pointerdown', e => { if (CINE && !(e.target.closest && e.target.closest('button'))) cineSkip(); });
  window.addEventListener('keydown', e => { if (e.key === ' ' || e.key === 'Enter') { if (CINE) cineSkip(); } else if (e.key === 'Escape' && PVX) pvEnd(); });
  gearDots();
  const closet = document.getElementById('closet'), skinGrid = document.getElementById('skinGrid'), trailGrid = document.getElementById('trailGrid');
  function buildCloset() {
    const mk = (list, grid, key, sw) => {
      grid.innerHTML = '';
      list.forEach(n => {
        const ok = gearOk(n), fr = ok && save.fresh && save.fresh.indexOf(n.id) >= 0, b = document.createElement('button');
        b.className = 'gear' + (save[key] === n.id ? ' cur' : '') + (ok ? '' : ' lock') + (fr ? ' fresh' : '') + (lastPick === n.id ? ' pick' : '');
        b.innerHTML = '<span class="sw" style="background:' + sw(n) + '"></span><span>' + n.name + '</span>' + (ok ? '' : '<small>' + n.need.txt + '</small>') + (fr ? '<i class="nw">new</i>' : '');
        b.addEventListener('click', () => {
          if (!ok) return;
          save[key] = n.id; lastPick = n.id; persist();
          if (key === 'skin') skin = n; else { trailId = n.id; trailPts = []; }
          buildCloset();
        });
        grid.appendChild(b);
      });
    };
    mk(SKINS, skinGrid, 'skin', n => 'linear-gradient(135deg,' + n.a + ',' + n.b + ')');
    mk(TRAILS, trailGrid, 'trail', n => n.sw);
  }
  const openCloset = () => { buildCloset(); closet.classList.remove('hide'); };
  document.getElementById('closetBtn').addEventListener('click', openCloset);
  document.getElementById('closetBtn2').addEventListener('click', openCloset);
  document.getElementById('closetDone').addEventListener('click', () => { closet.classList.add('hide'); lastPick = ''; if (hasFresh()) { save.fresh = []; persist(); gearDots(); } });
  document.getElementById('againBtn').addEventListener('click', () => { startGame(); });
  const sndBtn = document.getElementById('snd');
  sndBtn.addEventListener('click', () => {
    const m = Sound.toggle();
    sndBtn.textContent = m ? 'Sound off' : 'Sound on';
    sndBtn.classList.toggle('off', m);
  });
  const pauseBtn = document.getElementById('pauseBtn'), pausedEl = document.getElementById('paused');
  let pauseShown = false;
  function setPause(v) {
    if (v && state !== 'play') return;
    if (paused === v) return;
    paused = v; pausedEl.classList.toggle('hide', !v);
    Sound.visible(!v);
  }
  pauseBtn.addEventListener('click', () => { menuPanel.classList.remove('open'); setPause(true); });
  const menuBtn = document.getElementById('menuBtn'), menuPanel = document.getElementById('menuPanel'), gfxBtns = [...document.querySelectorAll('#gfxRow button')];
  menuBtn.addEventListener('click', () => menuPanel.classList.toggle('open'));
  document.addEventListener('pointerdown', e => { if (!menuPanel.contains(e.target) && !menuBtn.contains(e.target)) menuPanel.classList.remove('open'); });
  let shownQual = -1, gfxManual = false;
  function gfxUI() { shownQual = qual; gfxBtns.forEach(b => b.classList.toggle('cur', +b.dataset.q === qual)); }
  gfxBtns.forEach(b => b.addEventListener('click', () => {      // Low = 1x + lighter effects, Medium = up to 2x, High = up to 3x
    qual = +b.dataset.q; lowFx = qual >= 2; pcap = qual >= 2 ? 220 : 650; gfxManual = true; slowFor = 0; avgMs = 16; resize(); gfxUI();
  }));
  gfxUI();
  const testBtn = document.getElementById('testBtn'), testPanel = document.getElementById('testPanel');
  STAGES.forEach((st, i) => {
    const b = document.createElement('button'); b.textContent = (i + 1) + '. ' + st.name; b.dataset.i = i;
    b.addEventListener('click', () => { testPanel.classList.remove('open'); testJump(i); });
    testPanel.appendChild(b);
  });
  const ulb = document.createElement('button'); ulb.textContent = 'Unlock all moth gear';
  ulb.addEventListener('click', () => { const was = SKINS.concat(TRAILS).filter(n => !gearOk(n)).map(n => n.id); save.seen = [1, 1, 1, 1, 1, 1]; save.boss = 1; markFresh(was); testPanel.classList.remove('open'); notice('All moth gear unlocked', '#FFD166'); });
  testPanel.appendChild(ulb);
  const ntl = document.createElement('div'); ntl.textContent = 'Neon Mirage tests'; ntl.style.cssText = 'display:none;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#FF9ED8;margin-top:4px;text-align:center';
  testPanel.appendChild(ntl);
  const ntg = document.createElement('div'); ntg.style.cssText = 'display:none;grid-template-columns:1fr 1fr;gap:6px'; testPanel.appendChild(ntg);
  const NTESTS = [['Pop-ups', () => spawnPopups()], ['Marquee', () => spawnMarq()], ['Loading bar', () => spawnLbar()], ['Countdown', () => startCountdown()],
    ['Ctrl+Z', () => applyPower('ctrlz', moth.x, moth.y - 40)], ['Defrag', () => applyPower('defrag', moth.x, moth.y - 40)],
    ['Dial-up', () => applyPower('dialup', moth.x, moth.y - 40)], ['Save point', () => applyPower('save', moth.x, moth.y - 40)],
    ['Heat +25%', () => { diff = Math.min(1, diff + .25); checkTier(); }]];
  NTESTS.forEach(([name, fn]) => {
    const b = document.createElement('button'); b.textContent = name;
    b.addEventListener('click', () => {
      testPanel.classList.remove('open');
      if (state !== 'play' || paused || !moth) return;
      if (curStage === 4) fn();
    });
    ntg.appendChild(b);
  });
  const etl = document.createElement('div'); etl.textContent = 'Edge strip tests'; etl.style.cssText = 'font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#9AE6FF;margin-top:4px;text-align:center';
  testPanel.appendChild(etl);
  const etg = document.createElement('div'); etg.style.cssText = 'display:grid;grid-template-columns:1fr 1fr;gap:6px'; testPanel.appendChild(etg);
  [['Loot left', () => spawnEdgeItem(-1)], ['Loot right', () => spawnEdgeItem(1)], ['Jackpot', () => spawnEdgeItem(Math.random() < .5 ? -1 : 1, true)], ['Strip hazards', () => { spawnStripHazard(-1); spawnStripHazard(1); }]].forEach(([name, fn]) => {
    const b = document.createElement('button'); b.textContent = name;
    b.addEventListener('click', () => { testPanel.classList.remove('open'); if (state !== 'play' || paused || !moth) return; fn(); });
    etg.appendChild(b);
  });
  const otl = document.createElement('div'); otl.textContent = 'Overflow Reach tests'; otl.style.cssText = 'display:none;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#CDE26A;margin-top:4px;text-align:center';
  testPanel.appendChild(otl);
  const otg = document.createElement('div'); otg.style.cssText = 'display:none;grid-template-columns:1fr 1fr;gap:6px'; testPanel.appendChild(otg);
  [['Seam Colossus', () => { if (!boss && !CINE && !trans) { bossPending = 0; startBoss(0); } }], ['Colossus (hot)', () => { if (!boss && !CINE && !trans) { bossPending = 0; startBoss(1); } }],
    ['Reseed', () => applyPower('reseed', moth.x, moth.y - 40)], ['Heat +25%', () => { diff = Math.min(1, diff + .25); checkTier(); }]].forEach(([name, fn]) => {
    const b = document.createElement('button'); b.textContent = name;
    b.addEventListener('click', () => { testPanel.classList.remove('open'); if (state !== 'play' || paused || !moth || curStage !== 5) return; fn(); });
    otg.appendChild(b);
  });
  testBtn.addEventListener('click', () => {
    otl.style.display = curStage === 5 ? 'block' : 'none'; otg.style.display = curStage === 5 ? 'grid' : 'none';
    ntl.style.display = curStage === 4 ? 'block' : 'none'; ntg.style.display = curStage === 4 ? 'grid' : 'none';
    [...testPanel.children].forEach(b => b.classList.toggle('cur', +b.dataset.i === curStage));
    testPanel.classList.toggle('open');
  });
  document.getElementById('resumeBtn').addEventListener('click', () => setPause(false));
  document.getElementById('restartBtn').addEventListener('click', () => { setPause(false); startGame(); });
  window.addEventListener('keydown', e => { if (e.key === 'p' || e.key === 'P' || e.key === 'Escape') setPause(!paused); });
  document.addEventListener('visibilitychange', () => {
    if (document.hidden && state === 'play') setPause(true);        // leaving the app pauses the run
    else Sound.visible(!document.hidden && !paused);
  });

  ['700 20px MothDisplay','700 20px MothText','500 16px MothText','700 20px MothReef','600 20px MothIce','400 20px MothStorm','400 20px MothPixel','400 20px MothOverflow'].forEach(f => document.fonts && document.fonts.load(f));
  resize(); reset();
  let last = performance.now();
  let avgMs = 16, slowFor = 0;
  function frame(now) {
    const raw = (now - last) / 1000, dt = Math.min(raw, .05); last = now;
    if (paused) pausedTotal += raw;
    const rc = Math.min(raw, .1);        // a long gap (tab switch, pause) must not count as a slow frame
    if (!paused) avgMs += (rc * 1000 - avgMs) * .05;
    if (qual !== shownQual) gfxUI();
    if (!paused && !gfxManual && qual < 2 && avgMs > 30) {          // sustained low frame rate: step the look down (3x -> 2x -> 1x + light effects)
      slowFor += rc;
      if (slowFor > 2) { qual++; slowFor = 0; avgMs = 16; if (qual >= 2) { lowFx = true; pcap = 220; } resize(); }
    } else slowFor = 0;
    const showPause = state === 'play' && !paused;
    if (showPause !== pauseShown) { pauseShown = showPause; pauseBtn.classList.toggle('show', showPause); testBtn.classList.toggle('show', showPause); if (!showPause) testPanel.classList.remove('open'); }
    try {
      if (!paused) {
        if (impact) { impact.t += dt; if (impact.t >= impact.dur) impact = null; }
        if (hitStop > 0) hitStop -= dt; else if (CINE) cineStep(dt); else if (state === 'pv') { update(dt * PV_SLOW); pvStep(dt * PV_SLOW); } else update(dt);                // a few frames of hit-stop on the biggest strikes
      }
      draw(now / 1000 - pausedTotal);
    }
    catch (err) {                        // one bad frame must never freeze the whole game
      console.error(err);
      if (wBase) { W = wBase; wBase = 0; } bgS = 0;
      for (let i = 0; i < 12; i++) ctx.restore();
      ctx.setTransform(DPR, 0, 0, DPR, 0, 0); ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
